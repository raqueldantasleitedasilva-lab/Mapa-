<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nossas unidades</title>
<style>
/* Compatível com o web part "Incorporar" do SharePoint: sem JavaScript, sem fontes ou arquivos externos */
:root{--navy:#0B3B8F;--navy-deep:#082B6B;--green:#17963F;--yellow:#FBC616;--blue:#1F63C6;--se:#C6DBF3;--sul:#FF6B00;--ink:#0B2A5E;--muted:#51628A;--line:#DDE6F3;--font:'Segoe UI','Montserrat',Arial,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:#fff;font-family:var(--font);color:var(--ink)}
.wrap{max-width:1180px;margin:0 auto;padding:20px 20px 16px}
header{display:flex;align-items:center;gap:16px;margin-bottom:6px}
.wing{flex:none;width:60px;height:44px}
.bar{width:2px;align-self:stretch;background:var(--navy);border-radius:2px}
h1{margin:0;font-weight:800;font-size:clamp(24px,4vw,38px);line-height:1;color:var(--navy)}
header p{margin:6px 0 0;font-size:14px;color:var(--muted)}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:24px;align-items:center}
svg.map{display:block;width:100%;height:auto;overflow:visible}
.shadow{filter:drop-shadow(0 8px 8px rgba(11,59,143,.22))}
.shape-se{fill:var(--se)}.shape-sul{fill:var(--sul)}
.shape-se,.shape-sul{stroke:#fff;stroke-width:2.2;stroke-linejoin:round}
.reg{cursor:pointer;outline:none;transition:transform .2s ease-out,filter .2s}
.reg path{stroke:#fff;stroke-width:2.2;stroke-linejoin:round}
.reg-norte path{fill:var(--green)}.reg-ne path{fill:var(--yellow)}.reg-co path{fill:var(--blue)}
.reg:hover,.reg:focus-visible{transform:translateY(-7px);filter:brightness(1.08) drop-shadow(0 12px 10px rgba(11,59,143,.3))}
.reg:focus-visible path{stroke:var(--navy);stroke-width:3.5}
.lab{pointer-events:none}
.lab-name{font-weight:800;fill:#fff}
.lab-ne .lab-name{fill:var(--navy-deep)}
.chip{fill:var(--yellow)}.lab-ne .chip{fill:var(--navy)}
.chip-t{font-weight:800;font-size:11px;fill:var(--navy-deep);letter-spacing:.04em}
.lab-ne .chip-t{fill:#fff}
.city{cursor:pointer;outline:none}
.halo{stroke:#fff;stroke-width:4;stroke-linecap:round;opacity:.9}
.lead{stroke:var(--navy);stroke-width:1.4;stroke-linecap:round;stroke-dasharray:1 4}
.ring{fill:#fff;stroke:var(--navy);stroke-width:1.6}
.dot{fill:var(--navy)}
.pill{fill:#fff;stroke:var(--navy);stroke-width:1.8}
.pill-t{font-weight:800;font-size:13.5px;fill:var(--navy);letter-spacing:.02em}
.city:hover .pill,.city:focus-visible .pill{fill:var(--navy)}
.city:hover .pill-t,.city:focus-visible .pill-t{fill:#fff}
.city:hover .dot,.city:focus-visible .dot{fill:var(--yellow)}
.city:hover .ring,.city:focus-visible .ring{fill:var(--navy)}
.city:hover .lead,.city:focus-visible .lead{stroke-dasharray:none;stroke-width:1.8}
.city:focus-visible .pill{stroke:var(--yellow);stroke-width:3}
aside h2{margin:0 0 8px;font-size:13px;font-weight:700;color:var(--muted)}
aside ul{list-style:none;margin:0 0 20px;padding:0;border-top:1px solid var(--line)}
aside li{border-bottom:1px solid var(--line)}
.row{display:flex;align-items:center;gap:12px;padding:10px 8px;text-decoration:none;color:var(--ink);font-weight:700;font-size:15px;border-radius:6px;transition:background .15s,padding .15s}
.sw{width:12px;height:12px;border-radius:50%;flex:none;background:var(--navy)}
.rn{flex:1}
.rs{font-size:12px;font-weight:800;color:var(--muted);background:#EEF3FB;border-radius:999px;padding:3px 9px}
.r-norte .sw{background:var(--green)}.r-ne .sw{background:var(--yellow)}.r-co .sw{background:var(--blue)}
.row:hover,.row:focus-visible{background:#EEF4FD;padding-left:14px;outline:none}
.row:hover .rs{background:var(--navy);color:#fff}
.row:focus-visible{box-shadow:inset 0 0 0 2px var(--navy)}
@media (max-width:860px){.grid{grid-template-columns:1fr;gap:10px}aside{display:grid;grid-template-columns:1fr 1fr;gap:0 20px}.wrap{padding:14px 10px}}
@media (max-width:520px){aside{grid-template-columns:1fr}.wing{width:46px}}
@media (prefers-reduced-motion:reduce){.reg{transition:none}}
</style>
</head>
